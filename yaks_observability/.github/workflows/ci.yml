name: CI — yaks-observability

on:
  push:
    branches: [main]
    paths:
      - "yaks_observability/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "yaks_observability/**"
      - ".github/workflows/ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yaks_observability
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.1.4
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction --extras dev

      - name: Lint with ruff
        run: poetry run ruff check src/ tests/

      - name: Format check with ruff
        run: poetry run ruff format --check src/ tests/

      - name: Run tests
        env:
          SERVICE_MANAGEMENT_ENVIRONMENT: testing
        run: poetry run pytest tests/ -v --cov=src/yaks_observability --cov-report=term-missing

      - name: Security audit with pip-audit
        run: poetry run pip-audit --requirement <(poetry export --with dev --extras downstream --without-hashes)

      - name: Build package
        run: poetry build
