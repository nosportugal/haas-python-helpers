name: CI — yaks-observability

on:
  push:
    branches: [main]
    paths:
      - "yaks_observability/**"
      - ".github/workflows/ci-yaks-observability.yml"
  pull_request:
    branches: [main]
    paths:
      - "yaks_observability/**"
      - ".github/workflows/ci-yaks-observability.yml"

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: yaks_observability
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.1.4
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction --extras dev

      - name: Lint with ruff
        run: poetry run ruff check src/ tests/

      - name: Format check with ruff
        run: poetry run ruff format --check src/ tests/

      - name: Run tests
        env:
          ENVIRONMENT_TYPE: testing
        run: poetry run pytest tests/ -v --cov=src/yaks_observability --cov-report=term-missing

      - name: Security audit with pip-audit
        run: poetry run pip-audit --requirement <(poetry export --with dev --extras downstream --without-hashes)

      - name: Build package
        run: poetry build
